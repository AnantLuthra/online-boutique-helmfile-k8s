apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - name: service
        image: "{{ .Values.appImage }}:{{ .Values.appVersion }}"
        ports:
          - containerPort: {{ .Values.containerPort }}
        env:
        {{- range .Values.containerEnvVar}}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end}}
        # resources:
        #   requests:
        #     cpu: {{ .Values.requestedCpu | quote }}
        #     memory: {{ .Values.requestedMemory | quote }}
        #   limits:
        #     cpu: {{ .Values.limitCpu | quote }}
        #     memory: {{ .Values.limitMemory | quote }}
