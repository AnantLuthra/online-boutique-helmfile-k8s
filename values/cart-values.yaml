appName: cartservice
appImage: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice
appVersion: v0.10.7
replicaCount: 2
containerPort: 7070
containerEnvVar: 
- name: PORT
  value: "7070"
- name: REDIS_ADDR
  value: "redis-cart:6379"
