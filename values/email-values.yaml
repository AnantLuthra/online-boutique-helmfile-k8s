appName: emailservice
appImage: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/emailservice
appVersion: v0.10.7
replicaCount: 2
containerPort: 8080
containerEnvVar: 
- name: PORT
  value: "8080"
- name: DISABLE_PROFILER
  value: "1"
requestedCpu: 100m
requestedMemory: 64Mi
limitCpu: 200m
limitMemory: 128Mi

servicePort: 5000
serviceType: ClusterIP